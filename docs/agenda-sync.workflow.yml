# Sincronização dos calendários conectados (Google / .ics) → IsoScanning.
# Gratuito via GitHub Actions. Copie para .github/workflows/agenda-sync.yml.
#
# Configuração (uma vez, no GitHub do repo isoscanning):
#   Settings → Secrets and variables → Actions → New repository secret:
#     AGENDA_SYNC_URL = https://SEU_DOMINIO_DO_FRONT/api/agenda/cron-sync
#     CRON_SECRET     = mesmo valor do CRON_SECRET no .env.local / env do Render
#
# Observações:
# - A cada 30 min: uma rodada usa 1–3 requisições por conexão na Calendar API
#   (limite gratuito: 1.000.000/dia). Pode reduzir para "*/15" sem custo.
# - O horário do schedule pode atrasar alguns minutos (comportamento do GitHub).
# - Repositórios sem commits por 60 dias têm schedules pausados pelo GitHub.
# - O --max-time alto cobre o cold start de serviços free do Render.

name: Agenda Sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permite rodar manualmente na aba Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de sincronização
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 280 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.AGENDA_SYNC_URL }}"
